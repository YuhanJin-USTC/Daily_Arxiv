[project]
name = "daily-arxiv"
version = "0.1.0"
description = "Daily crawl arXiv papers and use LLMs to summarize them"
authors = [
    {name = "Wei Deng", email = "dw-dengwei@outlook.com"},
    {name = "Jian Guan", email = "jianguanthu@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=2.1.3",
    "scrapy>=2.12.0",
    "openai>=1.66.3,<2",
    "pydantic>=2.10.6,<3",
    "httpx>=0.28.1",
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
]
license = "Apache-2.0"


[tool.daily_arxiv]
language = "Chinese"
categories = ["physics.plasm-ph", "physics.acc-ph", "physics.optics", "physics.flu-dyn", "physics.atom-ph", "physics.comp-ph"]

[tool.daily_arxiv.deepseek]
# Official settings checked 2026-10-21; credentials only use OPENAI_API_KEY.
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
reasoning_effort = "max"
max_tokens = 393216
context_window = "1M"

[dependency-groups]
dev = [
    "ruff==0.17.1",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]  # CLI scripts explicitly add the repository to sys.path.
