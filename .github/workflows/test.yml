name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --frozen ruff check ai daily_arxiv scripts to_md tests
      - run: uv run --frozen ruff format --check ai daily_arxiv scripts to_md tests
      - run: uv run --frozen python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.cjs
      - run: bash -n run.sh && git diff --check
