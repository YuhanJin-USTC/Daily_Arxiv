name: Verify deployed website
on:
  push:
    branches: [main]
    paths: [.github/workflows/browser-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/arxiv-browser" playwright@1.64.1
          node "$RUNNER_TEMP/arxiv-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify live authentication and reader
        env:
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
          SITE_URL: https://yuhanjin-ustc.github.io/daily-arxiv/
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/arxiv-browser/node_modules/playwright
          BROWSER_REPORT_DIR: ${{ runner.temp }}/arxiv-browser-report
        run: node scripts/check_live_site.cjs
      - name: Preserve screenshots and sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arxiv-browser-report/
          if-no-files-found: ignore
          retention-days: 30
