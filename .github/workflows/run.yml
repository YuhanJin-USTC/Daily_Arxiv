name: Daily arXiv
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arxiv-data
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: data
          path: published
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        working-directory: code
        run: uv sync --frozen
      - name: Crawl and verify coverage
        id: crawl
        working-directory: code
        env:
          CATEGORIES: ${{ vars.CATEGORIES }}
        run: |
          set -euo pipefail
          day=$(date -u +%F)
          work="$RUNNER_TEMP/arxiv-daily"
          mkdir -p "$work"
          git -C ../published rev-parse HEAD > "$work/source-commit.txt"
          uv run --frozen python daily_arxiv/crawl.py --output "$work/$day.jsonl" \
            --history-dir ../published/data --audit "$work/coverage.json"
          echo "day=$day" >> "$GITHUB_OUTPUT"
          if [ -s "$work/$day.jsonl" ]; then
            echo 'has_new=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_new=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Generate and stage complete data
        id: stage
        if: steps.crawl.outputs.has_new == 'true'
        working-directory: code
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DAY: ${{ steps.crawl.outputs.day }}
        run: |
          set -euo pipefail
          uv run --frozen python -m ai.enhance --check-config
          uv run --frozen python scripts/stage_daily.py --source ../published \
            --raw "$RUNNER_TEMP/arxiv-daily/$DAY.jsonl" --date "$DAY" \
            --output "$RUNNER_TEMP/arxiv-daily/ready"
      - name: Verify and commit data only
        if: success() && steps.stage.outcome == 'success'
        working-directory: code
        run: |
          set -euo pipefail
          git -C ../published fetch origin data
          test "$(git -C ../published rev-parse HEAD)" = "$(git -C ../published rev-parse origin/data)"
          uv run --frozen python scripts/apply_staged.py --source ../published \
            --staged "$RUNNER_TEMP/arxiv-daily/ready"
          cd ../published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data assets/file-list.txt
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish validated arXiv summaries'
            git push origin HEAD:data
          fi
      - name: Preserve coverage and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-daily-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arxiv-daily/
          if-no-files-found: ignore
          retention-days: 14
