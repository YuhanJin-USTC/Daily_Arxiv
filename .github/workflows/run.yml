name: Daily arXiv
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arxiv-data
  cancel-in-progress: false
jobs:
  daily:
    if: vars.ENABLE_DAILY == 'true' && vars.ENABLE_DATA_WRITES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: data
          path: published
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        working-directory: code
        run: uv sync --frozen
      - name: Crawl once and publish verified raw discoveries
        id: raw
        working-directory: code
        env:
          CATEGORIES: ${{ vars.CATEGORIES }}
        run: |
          set -euo pipefail
          day=$(date -u +%F)
          work="$RUNNER_TEMP/arxiv-daily"
          mkdir -p "$work"
          uv run --frozen python daily_arxiv/crawl.py --output "$work/$day.jsonl" \
            --history-dir ../published/data --audit "$work/coverage.json"
          uv run --frozen python scripts/daily_update.py raw --source ../published \
            --raw "$work/$day.jsonl" --coverage "$work/coverage.json" --date "$day" \
            --output "$work/raw-ready" --publish
          echo "day=$day" >> "$GITHUB_OUTPUT"
      - name: Notify reliable researcher matches before AI
        id: notify
        if: vars.ENABLE_EMAIL == 'true'
        continue-on-error: true
        working-directory: code
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALLOW_SMTP_SEND: '1'
          DAY: ${{ steps.raw.outputs.day }}
          CATEGORIES: ${{ vars.CATEGORIES }}
        run: |
          uv run --frozen python scripts/daily_update.py notify --source ../published \
            --date "$DAY" --send --publish
      - name: Generate or resume English
        id: english
        if: vars.ENABLE_AI == 'true'
        continue-on-error: true
        working-directory: code
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uv run --frozen python scripts/daily_update.py ai --source ../published \
            --language English --output "$RUNNER_TEMP/arxiv-daily/English" --publish
      - name: Generate or resume Chinese
        id: chinese
        if: vars.ENABLE_AI == 'true'
        continue-on-error: true
        working-directory: code
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uv run --frozen python scripts/daily_update.py ai --source ../published \
            --language Chinese --output "$RUNNER_TEMP/arxiv-daily/Chinese" --publish
      - name: Preserve coverage and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-daily-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arxiv-daily/
          if-no-files-found: ignore
          retention-days: 14
      - name: Report independent failures
        if: always()
        env:
          RAW: ${{ steps.raw.outcome }}
          EMAIL: ${{ steps.notify.outcome }}
          ENGLISH: ${{ steps.english.outcome }}
          CHINESE: ${{ steps.chinese.outcome }}
        run: |
          for phase in "$RAW" "$EMAIL" "$ENGLISH" "$CHINESE"; do
            if [ "$phase" = failure ]; then exit 1; fi
          done
